[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-ai"
version = "0.1.0"
description = "F.R.I.D.A.Y — a personal AI assistant for your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mjawadshahid" }]

# Hard deps — everything needed to run friday in text mode.
dependencies = [
    "openai>=1.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.1",
    "send2trash>=1.8.2",
    "pydantic>=2.7.0",
    "dateparser>=1.2.0",
    "plyer>=2.1.0",   # desktop notifications for tools/check_reminders.py
]

# Voice deps are NOT installed by default. Install with:
#     pip install -e ".[voice]"
[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "scipy>=1.11.0",
    "pyttsx3>=2.90",
]
groq-stt = ["groq>=0.5.0"]

# This is the magic line: `friday` becomes a real command in your shell.
[project.scripts]
friday = "main:app"

[tool.setuptools]
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
include = ["core*", "tools*"]
